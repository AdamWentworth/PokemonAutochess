name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_cache,readwrite
      VCPKG_DISABLE_METRICS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${{ env.VCPKG_ROOT }}"
          & "${{ env.VCPKG_ROOT }}\\bootstrap-vcpkg.bat"
      - name: Install clang-format
        run: choco install llvm --no-progress -y
      - name: Format check
        env:
          FORMAT_BASE_REF: origin/master
        run: powershell -ExecutionPolicy Bypass -File tools/format_check.ps1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" -DPAC_BUILD_TOOLS=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Docs hygiene
        run: powershell -ExecutionPolicy Bypass -File tools/check_docs_hygiene.ps1
      - name: Validate data
        run: cmake --build build --config Debug --target PAC_ValidateData

  windows-runtime-visual-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_cache,readwrite
      VCPKG_DISABLE_METRICS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${{ env.VCPKG_ROOT }}"
          & "${{ env.VCPKG_ROOT }}\\bootstrap-vcpkg.bat"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" -DPAC_BUILD_TOOLS=ON -DBUILD_TESTING=ON
      - name: Build runtime smoke target
        run: cmake --build build --config Debug --target PokemonAutochess
      - name: Runtime visual smoke
        run: powershell -ExecutionPolicy Bypass -File tools/runtime_visual_smoke.ps1 -BuildDir build -Config Debug -Backends d3d12
      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-visual-smoke-artifacts
          path: |
            debug/runtime_visual_smoke
          if-no-files-found: warn
